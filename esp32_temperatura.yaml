esphome:
  name: esp32-agua
  friendly_name: "Sensor Temperatura Agua"

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ESP32-Agua-Fallback"
    password: "12345678"

captive_portal:

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  password: !secret ota_password

one_wire:
  - platform: gpio
    pin: GPIO4

sensor:
  - platform: dallas
    one_wire_id: onewire_bus
    index: 0
    name: "Temperatura Agua"
    unit_of_measurement: "°C"
    accuracy_decimals: 2
    update_interval: 60s
