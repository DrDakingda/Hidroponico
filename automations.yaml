- id: '1776365722855'
  alias: Riego Hidropónico - Diurno (08:00-20:00)
  description: Ciclos cada 20 min con duración adaptada por temperatura
  triggers:
  - trigger: time_pattern
    hours: "8-19"
    minutes: "/20"
  actions:
  - condition: state
    entity_id: switch.enchufe_riego_enchufe_1
    state: "off"
  - variables:
      temp: "{{ states('sensor.temperatura_malaga') | float(20) }}"
      minutos_riego: >
        {% if temp > 28 %}3
        {% elif temp >= 18 %}2
        {% else %}1
        {% endif %}
  - target:
      entity_id: switch.enchufe_riego_enchufe_1
    action: switch.turn_on
  - delay:
      minutes: "{{ minutos_riego }}"
  - target:
      entity_id: switch.enchufe_riego_enchufe_1
    action: switch.turn_off
  - action: input_number.increment
    target:
      entity_id: input_number.ciclos_riego_hoy
  - service: system_log.write
    data:
      message: "Riego ejecutado: {{ minutos_riego }}min a {{ temp }}°C"
      level: info
  mode: single

- id: '1776365722856'
  alias: Riego Hidropónico - Nocturno (20:00-08:00)
  description: Ciclo de 1 minuto cada 2 horas durante la noche
  triggers:
  - trigger: time
    at:
      - "20:00"
      - "22:00"
      - "00:00"
      - "02:00"
      - "04:00"
      - "06:00"
  actions:
  - condition: state
    entity_id: switch.enchufe_riego_enchufe_1
    state: "off"
  - target:
      entity_id: switch.enchufe_riego_enchufe_1
    action: switch.turn_on
  - delay:
      minutes: 1
  - target:
      entity_id: switch.enchufe_riego_enchufe_1
    action: switch.turn_off
  - action: input_number.increment
    target:
      entity_id: input_number.ciclos_riego_hoy
  - service: system_log.write
    data:
      message: "Riego nocturno ejecutado: 1 minuto"
      level: info
  mode: single

- id: 'reset_contadores_riego'
  alias: Reset contadores de riego a medianoche
  triggers:
  - trigger: time
    at: "00:01"
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.ciclos_riego_hoy
    data:
      value: 0
  - action: input_number.set_value
    target:
      entity_id: input_number.ciclos_saltados_hoy
    data:
      value: 0
  mode: single

- id: 'alerta_sensor_tiempo_caido'
  alias: Alerta - Sensor del tiempo no disponible
  triggers:
  - trigger: state
    entity_id: sensor.temperatura_malaga
    to: "unavailable"
    for:
      minutes: 30
  - trigger: state
    entity_id: sensor.temperatura_malaga
    to: "unknown"
    for:
      minutes: 30
  actions:
  - action: notify.email_david
    data:
      title: "Hidroponico - Sensor del tiempo caido"
      message: >
        El sensor de temperatura de Málaga lleva más de 30 minutos sin datos.
        El riego seguirá funcionando con valores por defecto (2 minutos por ciclo).
  mode: single

- id: 'alerta_enchufe_riego_caido'
  alias: Alerta - Enchufe de riego no disponible
  triggers:
  - trigger: state
    entity_id: switch.enchufe_riego_enchufe_1
    to: "unavailable"
    for:
      minutes: 10
  actions:
  - action: notify.email_david
    data:
      title: "Hidroponico - Enchufe de riego caido"
      message: >
        El enchufe de riego lleva más de 10 minutos sin responder.
        Las plantas NO están siendo regadas. Revisa el enchufe inteligente.
  mode: single

- id: 'alerta_riego_largo'
  alias: Alerta - Enchufe lleva demasiado tiempo encendido
  description: Seguridad ante bucles o fallos que dejen la bomba corriendo. Se apaga automáticamente
  triggers:
  - trigger: state
    entity_id: switch.enchufe_riego_enchufe_1
    to: "on"
    for:
      minutes: 6
  actions:
  - target:
      entity_id: switch.enchufe_riego_enchufe_1
    action: switch.turn_off
  - service: system_log.write
    data:
      message: "⚠️ SEGURIDAD: Enchufe de riego llevaba > 6min encendido. APAGADO automáticamente"
      level: error
  - action: notify.email_david
    data:
      title: "Hidroponico - RIEGO DETENIDO POR SEGURIDAD"
      message: >
        El enchufe de riego llevaba más de 6 minutos encendido y se ha apagado automáticamente.

        ⚠️ REVISA: Hay un problema en la automatización o en el enchufe inteligente.

        Timestamp: {{ now() }}
  mode: single

- id: 'resumen_diario_riego'
  alias: Resumen diario del sistema de riego
  triggers:
  - trigger: time
    at: "21:00"
  actions:
  - variables:
      temp_actual: "{{ states('sensor.temperatura_malaga') }}"
      hum_actual: "{{ states('sensor.humedad_malaga') }}"
      lluvia_actual: "{{ states('sensor.lluvia_malaga') }}"
      ciclos_ejecutados: "{{ states('input_number.ciclos_riego_hoy') | int(0) }}"
      ciclos_saltados: "{{ states('input_number.ciclos_saltados_hoy') | int(0) }}"
      total_disparos: "{{ ciclos_ejecutados + ciclos_saltados }}"
  - action: notify.email_david
    data:
      title: "Hidroponico - Resumen diario"
      message: >
        📊 RESUMEN DEL SISTEMA A LAS 21:00

        Condiciones climáticas:
        • Temperatura: {{ temp_actual }}°C
        • Humedad: {{ hum_actual }}%
        • Precipitación: {{ lluvia_actual }}mm

        Ciclos de riego:
        • Ejecutados: {{ ciclos_ejecutados }}
        • Saltados (humedad > 80%): {{ ciclos_saltados }}
        • Total disparadores: {{ total_disparos }}

        Estado enchufe: {{ states('switch.enchufe_riego_enchufe_1') | upper }}
  mode: single
